<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }
h1 { color: #58a6ff; }
h2 { color: #8b949e; margin: 2rem 0 1rem; border-bottom: 1px solid #21262d; padding-bottom: 0.5rem; }
table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
th { background: #21262d; padding: 0.75rem 1rem; text-align: left; font-weight: 600; color: #8b949e; font-size: 0.85rem; text-transform: uppercase; }
td { padding: 0.6rem 1rem; border-top: 1px solid #21262d; font-size: 0.9rem; }
tr:hover { background: #1c2128; }
.slow { background: rgba(248,81,73,0.08); }
.ok { color: #3fb950; }
.error { color: #f85149; font-weight: 600; }
.bottleneck { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.value { font-size: 1.8rem; font-weight: 700; color: #58a6ff; }
.label { font-size: 0.85rem; color: #8b949e; margin-top: 0.25rem; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
